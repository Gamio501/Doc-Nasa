[project]
name = "interprete-llm"
version = "0.1.0"
description = "Traduce hechos.json a textos simples con la Claude API"
requires-python = ">=3.11"
dependencies = ["anthropic>=1,<2", "pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src,../../contratos/py"
