[project]
name = "verificador"
version = "0.1.0"
description = "Revisa la interpretación del LLM y pone plantillas donde falla"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["contratos", "verificador"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src,../../contratos/py"
