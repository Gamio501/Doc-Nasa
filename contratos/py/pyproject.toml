[project]
name = "contratos"
version = "1.0.0"
description = "Modelos de los contratos v1 entre servicios y app"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contratos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
